<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Afiliados y Ganancias - D'UNIG</title>
    <!-- Importar Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --success-color: #4ade80;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 30px;
        }
        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #0f172a;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        tr:hover {
            background-color: rgba(56, 189, 248, 0.05);
        }
        .badge-codigo {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
        }
        .comision {
            color: var(--success-color);
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Reporte de Afiliados y Comisiones</h2>
        
        <div class="table-container">
            <div id="loading" class="loading">Cargando datos del ecosistema...</div>
            <table id="tabla-afiliados" style="display: none;">
                <thead>
                    <tr>
                        <th>Afiliado</th>
                        <th>Ciudad</th>
                        <th>Código VIP</th>
                        <th>Órdenes Referidas</th>
                        <th>Ganancias Totales</th>
                    </tr>
                </thead>
                <tbody id="tbody-afiliados">
                    <!-- Los datos se inyectarán aquí mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configura tus credenciales de Supabase
        const SUPABASE_URL = 'https://mkewwlmeikixpvfayisj.supabase.co'; // Reemplaza con tu URL de Supabase
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rZXd3bG1laWtpeHB2ZmF5aXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzg5NTAsImV4cCI6MjEwNTMxNDk1MH0.xUm7b8j4EGjHtsrBP9DgBURKRhrsPwOxhwKLCAMxZ1o'; // Reemplaza con tu Key Anon Publica

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarAfiliadosGanancias() {
            const loadingEl = document.getElementById('loading');
            const tablaEl = document.getElementById('tabla-afiliados');
            const tbodyEl = document.getElementById('tbody-afiliados');

            try {
                // Consultamos la vista de Supabase
                const { data, error } = await supabaseClient
                    .from('vista_afiliados_ganancias')
                    .select('*')
                    .order('total_comisiones_acumuladas', { ascending: false });

                if (error) {
                    throw error;
                }

                loadingEl.style.display = 'none';
                tablaEl.style.display = 'table';
                tbodyEl.innerHTML = '';

                if (data.length === 0) {
                    tbodyEl.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">No hay registros de afiliados aún.</td></tr>`;
                    return;
                }

                // Pintar los datos en la tabla (omitiendo cédula y teléfono de forma segura en el front)
                data.forEach(afiliado => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>${afiliado.nombre}</strong></td>
                        <td>${afiliado.ciudad || 'No especificada'}</td>
                        <td><span class="badge-codigo">${afiliado.codigo_referido}</span></td>
                        <td>${afiliado.total_ordenes_referidas}</td>
                        <td class="comision">$${Number(afiliado.total_comisiones_acumuladas).toFixed(2)}</td>
                    `;
                    tbodyEl.appendChild(fila);
                });

            } catch (err) {
                console.error('Error al cargar la vista:', err.message);
                loadingEl.innerHTML = `<span style="color: #ef4444;">Error al cargar los datos de la red.</span>`;
            }
        }

        // Ejecutar al cargar la página
        cargarAfiliadosGanancias();
    </script>
</body>
</html>
