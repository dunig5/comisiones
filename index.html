<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema D'UNIG | Red de Afiliados y Ganancias</title>
    <!-- Importar Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --card-border: #262626;
            --text-color: #ededed;
            --text-muted: #a3a3a3;
            --accent-orange: #ff6600;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --success-color: #00ff66;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a0a00 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding-top: 15px;
        }

        h2 {
            color: var(--accent-orange);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px var(--accent-orange-glow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Contenedor en lista vertical hacia abajo */
        #lista-afiliados {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Tarjeta futurista individual */
        .afiliado-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent-orange);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .afiliado-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-orange);
            box-shadow: 0 12px 30px var(--accent-orange-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #1f1f1f;
            padding-bottom: 10px;
        }

        .afiliado-nombre {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .badge-codigo {
            background-color: rgba(255, 102, 0, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 102, 0, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 0.9rem;
        }

        .info-group {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .info-value {
            color: var(--text-color);
            font-weight: 600;
        }

        .comision-value {
            color: var(--success-color);
            font-size: 1.1rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .loading, .mensaje-vacio {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-size: 1rem;
        }

        .mensaje-error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h2>D'UNIG LUXURY</h2>
            <div class="subtitle">Panel de Rendimiento y Ganancias de Afiliados</div>
        </header>
        
        <div id="loading" class="loading">Sincronizando con el ecosistema Supabase...</div>
        
        <div id="lista-afiliados">
            <!-- Las tarjetas verticales se inyectarán aquí automáticamente -->
        </div>
    </div>

    <script>
        // Tus credenciales oficiales de Supabase
        const SUPABASE_URL = 'https://mkewwlmeikixpvfayisj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rZXd3bG1laWtpeHB2ZmF5aXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzg5NTAsImV4cCI6MjEwNTMxNDk1MH0.xUm7b8j4EGjHtsrBP9DgBURKRhrsPwOxhwKLCAMxZ1o';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarAfiliadosGanancias() {
            const containerEl = document.getElementById('lista-afiliados');
            const loadingEl = document.getElementById('loading');

            try {
                // Consultamos directamente la vista creada en Supabase
                const { data, error } = await supabaseClient
                    .from('vista_afiliados_ganancias')
                    .select('*')
                    .order('total_comisiones_acumuladas', { ascending: false });

                if (error) {
                    throw error;
                }

                loadingEl.style.display = 'none';
                containerEl.innerHTML = '';

                if (!data || data.length === 0) {
                    containerEl.innerHTML = `<div class="mensaje-vacio">No se encontraron registros de afiliados activos en la red.</div>`;
                    return;
                }

                // Generar tarjetas verticales hacia abajo para cada afiliado
                data.forEach(afiliado => {
                    const card = document.createElement('div');
                    card.className = 'afiliado-card';
                    
                    const ciudadTexto = afiliado.ciudad || 'No especificada';
                    const totalOrdenes = afiliado.total_ordenes_referidas || 0;
                    const totalGanancias = Number(afiliado.total_comisiones_acumuladas || 0).toFixed(2);

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="afiliado-nombre">${afiliado.nombre}</span>
                            <span class="badge-codigo">${afiliado.codigo_referido}</span>
                        </div>
                        <div class="card-body">
                            <div class="info-group">
                                <span class="info-label">Ubicación</span>
                                <span class="info-value">${ciudadTexto}</span>
                            </div>
                            <div class="info-group">
                                <span class="info-label">Órdenes Referidas</span>
                                <span class="info-value">${totalOrdenes}</span>
                            </div>
                            <div class="info-group" style="grid-column: span 2; margin-top: 6px;">
                                <span class="info-label">Ganancias Totales Acumuladas</span>
                                <span class="comision-value">$${totalGanancias}</span>
                            </div>
                        </div>
                    `;
                    containerEl.appendChild(card);
                });

            } catch (err) {
                console.error('Error al conectar con Supabase:', err.message);
                loadingEl.style.display = 'none';
                containerEl.innerHTML = `<div class="mensaje-vacio mensaje-error">Error de conexión: No se pudieron cargar los datos de la red. Revisa la consola.</div>`;
            }
        }

        // Ejecutar la carga al iniciar la interfaz
        cargarAfiliadosGanancias();
    </script>
</body>
</html>
